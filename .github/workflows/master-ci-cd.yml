name: master-ci-cd

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  ci:
    name: CI (Build, Test & Publish)
    runs-on: ubuntu-latest
    continue-on-error: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.*

      - name: Restore
        run: dotnet restore V1.sln

      - name: Build
        run: dotnet build V1.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test V1.sln --configuration Release --no-build --verbosity normal

      - name: Publish
        run: dotnet publish V1.sln --configuration Release --output ./pub --no-build

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: v1-publish
          path: ./pub
          if-no-files-found: error

  cd:
    name: CD (Drploy to Azure App Service)
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v3
        with:
          name: v1-publish
          path: ./artifact

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          package: ./artifact
          app-name: workshop
          publish-profile: ${{ secrets.AZURE_PROFILE }}

            